<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Anmol Singh | Full-Stack Developer & AI/ML Engineer</title>

    <meta
      name="description"
      content="Portfolio of Anmol Singh — Full-Stack Developer and AI/ML Engineer focused on AI/ML, deep learning, computer vision, React, Python, and building real-world applications."
    />

    <meta name="author" content="Anmol Singh" />
    <meta name="robots" content="index, follow" />

    <!-- Replace with your actual deployed domain -->
    <link
      rel="canonical"
      href="https://yourdomain.com/"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0A0D12" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Anmol Singh | Full-Stack Developer & AI/ML Engineer"
    />
    <meta
      property="og:description"
      content="Portfolio of Anmol Singh — Full-Stack Developer and AI/ML Engineer focused on AI/ML, deep learning, computer vision, and real-world applications."
    />
    <meta
      property="og:url"
      content="https://yourdomain.com/"
    />
    <meta
      property="og:site_name"
      content="Anmol Singh Portfolio"
    />
    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="Anmol Singh | Full-Stack Developer & AI/ML Engineer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Anmol Singh — Full-Stack Developer and AI/ML Engineer focused on AI/ML, deep learning, computer vision, and real-world applications."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/og-image.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Person Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anmol Singh",
        "url": "https://yourdomain.com/",
        "jobTitle": "Full-Stack Developer & AI/ML Engineer",
        "sameAs": [
          "https://github.com/Anmol-Singh-Chehal",
          "https://www.linkedin.com/in/anmol-singh-296420321/",
          "https://leetcode.com/u/anmol-singh-chehal/"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
